<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tharabi E-commerce Shop</title>
    <link rel="stylesheet" href="children.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>

    <header>
        <div class="logo">
            <a id="home-link" href="#">Tharabi</a>
        </div>
        <div class="controls">
            <div class="search-wrap">
                <input type="search" id="search-input" placeholder="Search products, e.g., saree" class="search-input" aria-label="Search">
                <i class="fa fa-search search-icon"></i>
            </div>
            <div class="category-filter-wrap">
                <select id="category-filter" class="filter-select" title="Filter by category">
                    <option value="all">All categories</option>
                    <option value="dresses">Dresses</option>
                    <option value="saree">Sarees</option>
                    <option value="lehenga">Lehenga</option>
                    <option value="girls">Girls</option>
                </select>
            </div>
            <div class="cart-icon-area">
                <a id="open-cart" href="#" aria-label="Open cart">
                    <i class="fa fa-shopping-bag cart-icon"></i>
                    <span id="cart-item-count" class="cart-item-count">0</span>
                </a>
            </div>
            <h1 onclick="window.location.href='homepage.html'" class="home">🏠</h1>
        </div>
    </header>

    <main class="product-grid-container">
        <h1>Shop Products</h1>
        <div class="product-grid" id="product-grid">
        </div>
    </main>

    <div id="product-modal" class="modal">
        <div class="modal-content">
            <p class="back-to-shop-text" id="back-to-shop-btn">← Back to shop</p>
            <span class="close-btn">&times;</span>
            <div id="modal-product-details">
            </div>
        </div>
    </div>

    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button id="clear-cart-btn">Clear</button>
            <button id="cart-close-btn" class="cart-close-btn">&times;</button>
        </div>
        <div id="cart-items" class="cart-items">
        </div>
        <div class="cart-footer">
            <p>Total: ₹<span id="cart-total">0</span></p>
            <button id="checkout-btn">Checkout</button>
        </div>
    </div>

    <script src="children.js"></script>
</body>

</html>
