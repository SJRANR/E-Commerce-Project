<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tharabi Ecommerce Shop</title>
  <link rel="stylesheet" href="home.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body> 
  <header>
    <div class="logo" id="home-link">Tharabi</div>

    <div class="controls">
      <div class="search-wrap" title="Search products">
        <i class="ri-search-line" style="margin-right:8px;color:var(--muted-text)"></i>
        <input id="search-input" placeholder="Search products, e.g., saree" aria-label="Search products" />
      </div>

      <select id="category-filter" class="filter-select" title="Filter by category">
        <option value="all">All categories</option>
        <option value="dress">Dresses</option>
        <option value="saree">Sarees</option>
        <option value="lehenga">Lehenga</option>
        <option value="girls">Girls</option>
      </select>

      <div id="cart-icon" aria-label="Open cart" title="Open cart">
        <i class="ri-shopping-bag-line" style="font-size:1.1rem"></i>
        <span class="cart-item-count" id="cart-count">0</span>
      </div>
    </div>
  </header>

  <main class="container">
    
    <section id="shop-view-wrapper"> 
      <div class="hero">
        <div class="section-title">Shop Products</div>
        <div style="color:var(--muted-text)">Browse items — add to cart to try checkout</div>
      </div>
      <div id="shop-view">
        <div class="product-grid" id="product-grid">
          </div>
      </div>
    </section>

    <section id="product-detail-view" aria-hidden="true">
      <div style="margin-bottom:12px">
        <a href="#" id="detail-back-to-shop">&larr; Back to shop</a>
      </div>
      <div class="detail-wrap">
        <div class="detail-main-img" id="detail-main-img-wrap">
          <img id="detail-main-img" src="" alt="Product image">
        </div>
        <div class="detail-info">
          <h1 id="detail-product-title">Product Name</h1>
          <div style="display:flex;gap:12px;align-items:center">
            <div class="price" id="detail-current-price">₹0</div>
            <div style="color:var(--muted-text)" id="detail-old-price">MRP <del>₹0</del></div>
            <div style="color:green" id="detail-discount-percent">(0% OFF)</div>
          </div>

          <div style="margin-top:10px;color:var(--muted-text)" id="detail-rating"></div>

          <div style="margin-top:18px" class="product-description">
            <p id="detail-description-text" style="color:var(--text)"></p>
            <ul id="detail-specs" style="margin-top:10px; padding-left:20px; color:var(--muted-text); font-size:0.95rem"></ul>
          </div>
          
          <div style="margin-top:18px">
            <div><strong>Color</strong></div>
            <div class="options" id="detail-colors"></div>
          </div>

          <div style="margin-top:14px">
            <div><strong>Size</strong></div>
            <div class="options" id="detail-sizes">
              </div>
          </div>

          <div class="detail-action-buttons">
            <button id="detail-add-to-cart-btn" class="btn btn-outline">Add to Cart</button>
            <button id="detail-buy-now-btn" class="btn btn-primary">Buy Now</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <aside class="cart" id="cart-panel" aria-hidden="true">
    <div class="cart-head">
      <div style="font-weight:700;font-size:1.05rem">Your Cart</div>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="cart-clear" class="btn btn-outline" title="Clear cart">Clear</button>
        <button id="cart-close" class="btn" title="Close cart"><i class="ri-close-line"></i></button>
      </div>
    </div>

    <div class="cart-items" id="cart-items">
      <div class="cart-empty">Your cart is empty.</div>
    </div>

    <div class="cart-footer">
      <div class="cart-total">
        <div>Total</div>
        <div id="cart-total">₹0</div>
      </div>
      <button id="checkout-btn" class="checkout-btn">Checkout</button>
    </div>
  </aside>
  <script src="home.js"></script>
  </body>
</html>
