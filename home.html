<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tharabi-Ladies Cloth</title>
    <link rel="stylesheet" href="home.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo" id="home-link">Tharabi</div>

        <div class="controls">
            <div class="search-wrap" title="Search products">
                <i class="ri-search-line" style="margin-right:8px;color:var(--muted-text)"></i>
                <input id="search-input" placeholder="Search products, e.g., saree" aria-label="Search products" />
            </div>

            <select id="category-filter" class="filter-select" title="Filter by category">
                <option value="all">All categories</option>
                <option value="dress">Dresses</option>
                <option value="saree">Sarees</option>
                <option value="lehenga">Lehenga</option>
                <option value="girls">Girls</option>
            </select>

            <div id="cart-icon" class="cart-icon" aria-label="Open cart" title="View Cart">
                <i class="ri-shopping-bag-line"></i>
                <span id="cart-item-count" class="cart-count">0</span>
            </div>
            <h1 onclick="window.location.href='homepage.html'" class="home">🏠</h1>
        </div>
    </header>

    <main class="main-content">
        <section id="product-grid-view" class="product-grid-container">
            <h1>Shop Products</h1>
            <div class="product-grid" id="product-grid">
            </div>
        </section>

        <section id="product-detail-view" class="product-detail hidden">
            <div class="back-to-shop-text" id="detail-back">← Back to shop</div>

            <div class="detail-content">
                <div class="detail-image-container">
                    <img id="detail-img" src="#" alt="Product Image" class="detail-img">
                </div>

                <div class="detail-info">
                    <h1 id="detail-title" class="detail-title">Product Title</h1>

                    <div class="detail-price-rating">
                        <div class="price-container">
                            <span id="detail-price" class="current-price">₹1200</span>
                            <span id="detail-old-price" class="old-price">₹1700</span>
                            <span id="detail-discount" class="discount-percent">(29% OFF)</span>
                        </div>
                        <div class="rating-summary">
                            <i class="ri-star-fill"></i>
                            <span id="detail-rating">4.5</span>
                            <span class="review-count">(100 reviews)</span>
                        </div>
                    </div>

                    <p class="section-title">Description</p>
                    <p id="detail-desc" class="detail-description">Product description goes here...</p>

                    <div class="detail-options">
                        <p class="section-title" id="sizes-title">Available Sizes</p>
                        <div class="options" id="detail-sizes">
                        </div>
                    </div>

                    <div class="detail-action-buttons">
                        <button id="detail-add-to-cart-btn" class="btn btn-outline"><i class="ri-shopping-bag-line"></i> Add to Cart</button>
                        <button id="detail-buy-now-btn" class="btn btn-primary">Buy Now</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <aside class="cart" id="cart-panel" aria-hidden="true">
        <div class="cart-head">
            <div style="font-weight:700;font-size:1.05rem">Your Cart</div>
            <div style="display:flex;gap:8px;align-items:center">
                <button id="cart-clear" class="btn btn-outline" title="Clear cart">Clear</button>
                <button id="cart-close" class="btn" title="Close cart"><i class="ri-close-line"></i></button>
            </div>
        </div>

        <div class="cart-items" id="cart-items">
            <div class="cart-empty">Your cart is empty.</div>
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <div>Total</div>
                <div id="cart-total">₹0</div>
            </div>
            <button id="checkout-btn" class="btn btn-primary">Checkout</button>
        </div>
    </aside>


    <script src="home.js"></script>
</body>

</html>
