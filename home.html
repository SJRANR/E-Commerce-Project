<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tharabi E-commerce Shop</title>
    <link rel="stylesheet" href="home.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo" id="home-link">Tharabi</div>

        <div class="controls">
            <div class="search-wrap" title="Search products">
                <i class="ri-search-line" style="margin-right:8px;color:var(--muted-text)"></i>
                <input id="search-input" placeholder="Search products, e.g., saree" aria-label="Search products" />
            </div>

            <select id="category-filter" class="filter-select" title="Filter by category">
                <option value="all">All categories</option>
                <option value="dress">Dresses</option>
                <option value="saree">Sarees</option>
                <option value="lehenga">Lehenga</option>
                <option value="girls">Girls</option>
            </select>

            <div id="cart-icon" class="cart-icon" aria-label="Open cart" title="Open cart">
                <i class="ri-shopping-bag-line"></i>
                <span id="cart-counter" class="cart-counter" style="display:none;">0</span>
            </div>
        </div>
    </header>

    <main>
        <section id="shop-view-wrapper">
            <h1 style="color:var(--primary);margin-bottom:20px;text-align:center;">LATEST ETHNIC WEAR COLLECTION</h1>
            <div class="products-grid" id="products-grid">
            </div>
        </section>


        <section id="product-detail-view" aria-hidden="true" class="detail-container">
            <button id="detail-back-btn" class="back-btn" title="Back to products" style="display:none;"><i class="ri-arrow-left-line"></i> Back</button>

            <div class="detail-wrap">
                <div class="detail-gallery">
                    <div class="detail-main-img">
                        <img id="detail-main-img" src="#" alt="Product Detail Image">
                    </div>
                </div>

                <div class="detail-info">
                    <h1 id="detail-title">Product Title</h1>

                    <div class="product-rating" id="detail-rating">
                    </div>

                    <div class="product-price-info">
                        <span id="detail-current-price" class="current-price price">₹0</span>
                        <span id="detail-old-price" class="old-price" style="display:none;"></span>
                        <span id="detail-discount" class="discount-badge" style="display:none;"></span>
                    </div>

                    <div class="product-description-wrap">
                        <h3>Description</h3>
                        <p id="detail-desc">Product description will be displayed here.</p>
                    </div>

                    <div class="product-ratings-reviews-detail">
                        <h3 style="margin-bottom:15px; border-top: 1px solid var(--card-border); padding-top: 20px;">Customer Ratings & Reviews</h3>

                        <div class="ratings-summary-detail">
                            <div class="overall-rating-detail">
                                <div class="rating-value-detail" id="overallAvgRating"></div>
                                <div class="rating-total-count" id="totalRatingReviews"></div>
                            </div>
                            <div class="rating-breakdown-detail" id="ratingBreakdownBars">
                            </div>
                        </div>
                    </div>
                    <div class="detail-options-group">
                        <div><strong>Size</strong></div>
                        <div class="options" id="detail-sizes">
                        </div>
                    </div>

                    <div class="detail-action-buttons">
                        <button id="detail-add-to-cart-btn" class="btn btn-outline"><i class="ri-shopping-cart-line"></i> Add to Cart</button>
                        <button id="detail-buy-now-btn" class="btn btn-primary">Buy Now</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <aside class="cart" id="cart-panel" aria-hidden="true">
        <div class="cart-head">
            <div style="font-weight:700;font-size:1.05rem">Your Cart</div>
            <div style="display:flex;gap:8px;align-items:center">
                <button id="cart-clear" class="btn btn-outline" title="Clear cart">Clear</button>
                <button id="cart-close" class="btn" title="Close cart"><i class="ri-close-line"></i></button>
            </div>
        </div>

        <div class="cart-items" id="cart-items">
            <div class="cart-empty">Your cart is empty.</div>
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <div>Total</div>
                <div id="cart-total">₹0</div>
            </div>
            <button id="checkout-btn" class="checkout-btn">Proceed to Checkout</button>
        </div>
    </aside>

    <script src="home.js"></script>
</body>

</html>
