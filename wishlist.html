<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            text-align: center;
        }
        
        h1 {
            color: #d63384;
            padding: 15px;
        }
        
        .wishlist-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        
        .wishlist-item {
            background: #fff;
            border-radius: 10px;
            width: 220px;
            padding: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            transition: transform 0.2s;
        }
        
        .wishlist-item:hover {
            transform: scale(1.03);
        }
        
        .wishlist-item img {
            width: 100%;
            height: 160px;
            border-radius: 8px;
            object-fit: cover;
        }
        
        .wishlist-item h3 {
            margin: 10px 0 5px;
            font-size: 16px;
        }
        
        .wishlist-item p {
            color: #444;
            font-weight: bold;
        }
        
        .remove-btn {
            position: absolute;
            top: 6px;
            right: 10px;
            background-color: transparent;
            border: none;
            font-size: 20px;
            color: #ff4d4d;
            cursor: pointer;
        }
        
        .remove-btn:hover {
            color: #c70000;
        }
        
        .no-items {
            margin-top: 50px;
            color: #888;
            font-size: 18px;
        }
        /* Floating Home Emoji Button */
        
        .home-emoji {
            position: fixed;
            bottom: 20px;
            right: 25px;
            font-size: 30px;
            background-color: #007bff;
            color: white;
            border-radius: 50%;
            padding: 10px 12px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, background-color 0.2s;
            z-index: 1000;
        }
        
        .home-emoji:hover {
            transform: scale(1.1);
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <h1>❤️ My Favourite Items</h1>
    <div id="wishlist-container" class="wishlist-container"></div>

    <!-- Floating Home Emoji Button -->
    <span class="home-emoji" onclick="window.location.href='all.html'">🏠</span>

    <script>
        const wishlistContainer = document.getElementById('wishlist-container');
        let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];

        function renderWishlist() {
            wishlistContainer.innerHTML = '';

            if (wishlist.length === 0) {
                wishlistContainer.innerHTML = '<p class="no-items">No items in wishlist.</p>';
                return;
            }

            wishlist.forEach(item => {
                // Prevent showing undefined items
                if (!item.image || !item.name || !item.price) return;

                const div = document.createElement('div');
                div.classList.add('wishlist-item');
                div.innerHTML = `
                    <button class="remove-btn" onclick="removeItem('${item.id}')">❌</button>
                    <img src="${item.image}" alt="${item.name}">
                    <h3>${item.name}</h3>
                    <p>${item.price}</p>
                `;
                wishlistContainer.appendChild(div);
            });
        }

        function removeItem(id) {
            wishlist = wishlist.filter(i => i.id !== id);
            localStorage.setItem('wishlist', JSON.stringify(wishlist));
            renderWishlist();
        }

        renderWishlist();
    </script>

</body>

</html>
