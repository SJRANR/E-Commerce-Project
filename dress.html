<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headphones Store</title>
  <link rel="stylesheet" href="dress.css">
  
</head>
<body>
  <section class="products">
    <h4 class="section-title">🎧 Headphones</h4>
    <h2 class="main-heading">Discover Our Headphones</h2>

    <div class="product-container">
      <div class="product-card">
        <div class="img-box">
          <img src="images.png/brownpag.png" alt="Navy Headphones">
          <i class="fa-regular fa-heart fav-icon"></i>
        </div>
        <h3>Navy Headphones</h3>
        <p>$87.99</p>
      </div>

      <div class="product-card">
        <div class="img-box">
          <img src="images.png/makeupproduct.jpg" alt="White Headphones">
          <i class="fa-regular fa-heart fav-icon"></i>
        </div>
        <h3>White Headphones</h3>
        <p>$109.99</p>
      </div>

      <div class="product-card">
        <div class="img-box">
          <img src="images.png/footwareproducts.jpg" alt="Candy Headphones">
          <i class="fa-regular fa-heart fav-icon"></i>
        </div>
        <h3>Candy Headphones</h3>
        <p>$88.99</p>
      </div>

      <div class="product-card">
        <div class="img-box">
          <img src="images.png/earring.png" alt="Mauve Smartwatch">
          <i class="fa-regular fa-heart fav-icon"></i>
        </div>
        <h3>Mauve Smartwatch</h3>
        <p>$95.99</p>
      </div>
    </div>
  </section>
</body>
</html>
