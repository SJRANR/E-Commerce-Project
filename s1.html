<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tharabi Ecommerce Shop</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f8f8f8;
    }

    header {
      background-color: #333;
      color: #fff;
      padding: 15px 0;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 30px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .product {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: 0.3s;
      position: relative;
    }

    .product:hover {
      transform: translateY(-5px);
    }

    .product img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .product-info {
      padding: 15px;
      text-align: center;
    }

    .product h3 {
      font-size: 18px;
      margin: 10px 0;
    }

    .product p {
      color: #555;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .wishlist {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 24px;
      color: gray;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .wishlist.active {
      color: red;
    }

    .add-to-cart {
      background-color: #28a745;
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    .add-to-cart:hover {
      background-color: #218838;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #333;
      color: #fff;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Tharabi Ecommerce Shop</h1>
  </header>

  <div class="container" id="product-list">
    <!-- Example Product -->
    <div class="product">
      <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad" alt="Product 1">
      <div class="wishlist" onclick="toggleWishlist(this)">&#10084;</div>
      <div class="product-info">
        <h3>Men’s Jacket</h3>
        <p>₹1,499</p>
        <button class="add-to-cart" onclick="addToCart('Men’s Jacket', 1499)">Add to Cart</button>
      </div>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1542293787938-c9e299b8806b" alt="Product 2">
      <div class="wishlist" onclick="toggleWishlist(this)">&#10084;</div>
      <div class="product-info">
        <h3>Running Shoes</h3>
        <p>₹2,299</p>
        <button class="add-to-cart" onclick="addToCart('Running Shoes', 2299)">Add to Cart</button>
      </div>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f" alt="Product 3">
      <div class="wishlist" onclick="toggleWishlist(this)">&#10084;</div>
      <div class="product-info">
        <h3>Smart Watch</h3>
        <p>₹3,999</p>
        <button class="add-to-cart" onclick="addToCart('Smart Watch', 3999)">Add to Cart</button>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2025 Tharabi Ecommerce Shop | All Rights Reserved</p>
  </footer>

  <script>
    // Wishlist Toggle
    function toggleWishlist(element) {
      element.classList.toggle('active');
    }

    // Add to Cart Logic (simple demo)
    let cart = [];

    function addToCart(productName, price) {
      cart.push({ productName, price });
      alert(`${productName} added to cart!`);
      console.log(cart);
    }
  </script>

</body>
</html>
